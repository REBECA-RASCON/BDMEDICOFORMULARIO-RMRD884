<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personal - Consultorio Médico RMRD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fefcbf; 
            color: #333333;
        }

        .cabecera {
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            gap: 15px;
            border-bottom: 4px solid #b7791f;
        }

        .cabecera h1 {
            font-family: 'Montserrat', sans-serif;
            color: #b7791f; 
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .logo-contenedor img {
            height: 90px;
            background-color: white;
            padding: 5px;
            border-radius: 8px;
        }

        
        .menu-navegacion {
            display: flex;
            justify-content: space-around;
            background-color: #fef3c7; 
            padding: 15px 0;
            border-bottom: 1px solid #b7791f;
        }

        .menu-navegacion a {
            font-family: 'Montserrat', sans-serif;
            color: #744210; 
            text-decoration: none; 
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .menu-navegacion a:hover {
            color: #b7791f;
            text-decoration: none; 
            transition: all 0.3s ease; 
        }

        
        .contenedor-formulario {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(183, 121, 31, 0.1);
            border: 1px solid #fef3c7;
        }

        .contenedor-formulario h2 {
            font-family: 'Montserrat', sans-serif;
            color: #744210; 
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-size: 22px;
            letter-spacing: 1px;
        }

       
        .grupo-campo {
            margin-bottom: 20px;
        }

        .grupo-campo label {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            margin-bottom: 8px;
            color: #744210;
            font-size: 14px;
        }

        .grupo-campo input, 
        .grupo-campo select {
            width: 100%;
            padding: 11px;
            border: 1px solid #b7791f;
            border-radius: 4px;
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fffdfa;
            transition: all 0.3s ease;
        }

        .grupo-campo input:focus, 
        .grupo-campo select:focus {
            outline: none;
            border-color: #744210;
            background-color: #fff;
            box-shadow: 0 0 5px rgba(116, 66, 16, 0.2);
        }

        .grupo-campo select {
            cursor: pointer;
            height: 44px;
        }

        
        .boton-enviar {
            width: 100%;
            padding: 12px;
            background-color: #744210;
            color: white;
            border: none;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .boton-enviar:hover {
            background-color: #b7791f;
        }

        footer {
            font-family: 'Montserrat', sans-serif;
            margin-top: 60px;
            padding: 15px;
            border-top: 2px dashed #b7791f; 
            font-size: 11px;
            color: #555555;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="cabecera">
        <h1>Consultorio Médico RMRD</h1>
        <div class="logo-contenedor">
            <img src="logo2.png" alt="Logo Consultorio">
        </div>
    </header>

    <nav class="menu-navegacion">
        <a href="formupacie.html">Clientes</a>
        <a href="formdoctores.html">Médicos</a>
        <a href="formpersonal.html">Personal</a>
        <a href="formcitas.html">Citas</a>
    </nav>

    <main class="contenedor-formulario">
        <a href="index.html" style="display: inline-block; margin-bottom: 15px; color: #555; text-decoration: none; font-weight: 600; font-size: 14px; font-family: 'Montserrat', sans-serif;">&larr; Volver al Menú Principal</a>

        <h2>Registro de Personal</h2>
        
        <form action="#" method="POST">
            <div class="grupo-campo">
                <label for="idPersonal">ID Personal:</label>
                <input type="text" id="idPersonal" name="idPersonal" placeholder="Ej. 13959" required>
            </div>

            <div class="grupo-campo">
                <label for="nombre">Nombre(s):</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Elena Clara" required>
            </div>

            <div class="grupo-campo">
                <label for="apellidoPaterno">Apellido Paterno:</label>
                <input type="text" id="apellidoPaterno" name="apellidoPaterno" placeholder="Ej. Avila" required>
            </div>

            <div class="grupo-campo">
                <label for="apellidoMaterno">Apellido Materno:</label>
                <input type="text" id="apellidoMaterno" name="apellidoMaterno" placeholder="Ej. Rodriguez" required>
            </div>

            <div class="grupo-campo">
                <label for="genero">Género:</label>
                <select id="genero" name="genero" required>
                    <option value="" disabled selected hidden>Seleccione una opción</option>
                    <option value="femenino">Femenino</option>
                    <option value="masculino">Masculino</option>
                    <option value="otro">Otro / No especificar</option>
                </select>
            </div>

            <div class="grupo-campo">
                <label for="rol">Rol / Puesto:</label>
                <input type="text" id="rol" name="rol" placeholder="Ej. Recepcionista, Enfermero, Limpieza..." required>
            </div>

            <div class="grupo-campo">
                <label for="especialidad">Especialidad / Área:</label>
                <input type="text" id="especialidad" name="especialidad" placeholder="Ej. Atención al cliente, Quirúrgica..." required>
            </div>

            <div class="grupo-campo">
                <label for="cedula">Cédula:</label>
                <input type="text" id="cedula" name="cedula" placeholder="Número de cédula o registro laboral" required>
            </div>

            <div class="grupo-campo">
                <label for="rfc">RFC:</label>
                <input type="text" id="rfc" name="rfc" placeholder="Clave de Registro Federal" style="text-transform: uppercase;" required>
            </div>

            <div class="grupo-campo">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <button type="submit" class="boton-enviar">Registrar Personal</button>
        </form>
    </main>

    <footer>
        REBECA MIRANDA RASCON DEVORA 4;J 24308051280884 PROGRAMACION
    </footer>

</body>
</html>
