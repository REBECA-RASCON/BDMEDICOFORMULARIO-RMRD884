<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Médicos - Consultorio Médico RMRD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f7f5; 
            color: #333333;
        }

        .cabecera {
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            gap: 15px;
            border-bottom: 4px solid #0f766e; 
        }

        .cabecera h1 {
            font-family: 'Montserrat', sans-serif;
            color: #0f766e; 
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .logo_contenedor img {
            height: 90px;
            background-color: white;
            padding: 5px;
            border-radius: 8px;
        }

        .menu_navegacion {
            display: flex;
            justify-content: space-around;
            background-color: #e6f2f0; 
            padding: 15px 0;
            border-bottom: 1px solid #0f766e;
        }

        .menu_navegacion a {
            font-family: 'Montserrat', sans-serif;
            color: #0f766e; 
            text-decoration: none; 
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .menu_navegacion a:hover {
            color: #111827;
            text-decoration: none; 
            transition: all 0.3s ease; 
        }

        .contenedor_formulario {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.08);
            border: 1px solid #ccfbf1;
        }

        .contenedor_formulario h2 {
            font-family: 'Montserrat', sans-serif;
            color: #111827; 
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .grupo_campo {
            margin-bottom: 20px;
        }

        .grupo_campo label {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            margin-bottom: 8px;
            color: #0f766e;
            font-size: 14px;
        }

        .grupo_campo input, 
        .grupo_campo select {
            width: 100%;
            padding: 11px;
            border: 1px solid #0f766e;
            border-radius: 4px;
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fbfdfc;
            transition: all 0.3s ease;
        }

        .grupo_campo input:focus, 
        .grupo_campo select:focus {
            outline: none;
            border-color: #111827;
            background-color: #fff;
            box-shadow: 0 0 5px rgba(17, 24, 39, 0.15);
        }

        .grupo_campo select {
            cursor: pointer;
            height: 44px;
        }

        .boton_enviar {
            width: 100%;
            padding: 12px;
            background-color: #111827;
            color: white;
            border: none;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .boton_enviar:hover {
            background-color: #0f766e;
        }

        footer {
            font-family: 'Montserrat', sans-serif;
            margin-top: 60px;
            padding: 15px;
            border-top: 2px dashed #0f766e; 
            font-size: 11px;
            color: #555555;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="cabecera">
        <h1>Consultorio Médico RMRD</h1>
        <div class="logo_contenedor">
            <img src="logo2.png" alt="Logo Consultorio">
        </div>
    </header>

    <nav class="menu_navegacion">
        <a href="formupacie.html">Clientes</a>
        <a href="formdoctores.html">Médicos</a>
        <a href="formpersonal.html">Personal</a>
        <a href="formcitas.html">Citas</a>
    </nav>

    <main class="contenedor_formulario">
        <a href="index.html" style="display: inline-block; margin-bottom: 15px; color: #555; text-decoration: none; font-weight: 600; font-size: 14px; font-family: 'Montserrat', sans-serif;">&larr; Volver al Menú Principal</a>

        <h2>Registro de Médicos</h2>
        
        <form action="#" method="POST">
            <div class="grupo_campo">
                <label for="idMedico">ID Médico:</label>
                <input type="text" id="idMedico" name="idMedico" placeholder="Ej. 1396" required>
            </div>

            <div class="grupo_campo">
                <label for="nombreMedico">Nombre(s) del Médico:</label>
                <input type="text" id="nombreMedico" name="nombreMedico" placeholder="Ej. Alicia" required>
            </div>

            <div class="grupo_campo">
                <label for="apellidoPaternoMedico">Apellido Paterno del Médico:</label>
                <input type="text" id="apellidoPaternoMedico" name="apellidoPaternoMedico" placeholder="Ej. Alvarado" required>
            </div>

            <div class="grupo_campo">
                <label for="apellidoMaternoMedico">Apellido Materno del Médico:</label>
                <input type="text" id="apellidoMaternoMedico" name="apellidoMaternoMedico" placeholder="Ej. Orenda" required>
            </div>

            <div class="grupo_campo">
                <label for="genero">Género:</label>
                <select id="genero" name="genero" required>
                    <option value="" disabled selected hidden>Seleccione una opción</option>
                    <option value="femenino">Femenino</option>
                    <option value="masculino">Masculino</option>
                    <option value="otro">Otro / No especificar</option>
                </select>
            </div>

            <div class="grupo_campo">
                <label for="especialidad">Especialidad:</label>
                <input type="text" id="especialidad" name="especialidad" placeholder="Ej. Cardiología, Dermatología..." required>
            </div>

            <div class="grupo_campo">
                <label for="cedula">Cédula Profesional:</label>
                <input type="text" id="cedula" name="cedula" placeholder="Número de cédula" required>
            </div>

            <div class="grupo_campo">
                <label for="rfc">RFC:</label>
                <input type="text" id="rfc" name="rfc" placeholder="Clave de Registro Federal de Contribuyentes" style="text-transform: uppercase;" required>
            </div>

            <div class="grupo_campo">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <button type="submit" class="boton_enviar">Registrar Médico</button>
        </form>
    </main>

    <footer>
        REBECA MIRANDA RASCON DEVORA 4;J 24308051280884 PROGRAMACION
    </footer>

</body>
</html>
